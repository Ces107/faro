[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro"
version = "0.1.0"
description = "Genera el pack de presencia digital de un negocio local en minutos: una landing de una página, el contenido de Google Business, el WhatsApp y la tarjeta de reseñas con QR. Sin cuentas de pago para la demo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "César Pereiro" }]
keywords = ["presencia digital", "google business", "landing", "whatsapp", "pymes", "negocios locales", "reseñas"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "segno>=1.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Modo "live": el copy lo redacta la API de Anthropic. La demo funciona SIN esto.
live = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
faro = "faro.server:main"
faro-prospect = "faro.prospect.cli:main"
faro-demo = "faro.livedemo:main"
faro-publish = "faro.publish:main"

[project.urls]
Homepage = "https://github.com/Ces107/faro"
Repository = "https://github.com/Ces107/faro"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faro = [
    "py.typed",
    "templates/*.html",
    "engine/templates/*.html",
    "engine/templates/blocks/*.html",
    "engine/assets/fonts/*.woff2",
    "engine/assets/js/*.js",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"src/faro/icons.py" = ["E501"]
"src/faro/engine/demo.py" = ["E501"]  # datos de ejemplo: cadenas largas legibles
"src/faro/engine/scripts.py" = ["E501"]  # JS embebido: líneas legibles, no Python
"src/faro/prospect/route.py" = ["E501"]  # CSS embebido: una regla por línea
"src/faro/prospect/flyers.py" = ["E501"]  # CSS embebido: una regla por línea

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/faro"]

[[tool.mypy.overrides]]
module = ["anthropic", "segno"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
